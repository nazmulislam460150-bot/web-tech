<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café - Online Food Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="container">
 
    <h1>Campus Cafe</h1>
    <h2>Online Food Ordering System</h2>
 
    <form id="orderForm">
 
        <fieldset>
            <legend>Customer Information</legend>
 
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <small class="error" id="nameError"></small>
 
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <small class="error" id="emailError"></small>
 
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number">
            <small class="error" id="phoneError"></small>
 
            <label>Student ID</label>
            <input type="text" id="studentId" placeholder="Enter your Student ID">
            <small class="error" id="studentIdError"></small>
 
            <label>Gender</label>
 
            <div class="radio-group">
                <input type="radio" name="gender" id="male" value="Male">
                <label for="male">Male</label>
 
                <input type="radio" name="gender" id="female" value="Female">
                <label for="female">Female</label>
            </div>
 
            <small class="error" id="genderError"></small>
 
            <label>Department</label>
 
            <select id="department">
                <option value="">--Select Department--</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="English">English</option>
                <option value="Other">Other</option>
            </select>
 
            <small class="error" id="departmentError"></small>
 
        </fieldset>
 
        <fieldset>
            <legend>Food Selection</legend>
 
            <div class="food-list">
 
                <label>
                    <input type="checkbox" class="food" value="Burger" data-price="5">
                    Burger ($5)
                </label>
 
                <label>
                    <input type="checkbox" class="food" value="Pizza" data-price="8">
                    Pizza ($8)
                </label>
 
                <label>
                    <input type="checkbox" class="food" value="Sandwich" data-price="4">
                    Sandwich ($4)
                </label>
 
                <label>
                    <input type="checkbox" class="food" value="French Fries" data-price="3">
                    French Fries ($3)
                </label>
 
                <label>
                    <input type="checkbox" class="food" value="Coffee" data-price="2">
                    Coffee ($2)
                </label>
 
                <label>
                    <input type="checkbox" class="food" value="Cold Drink" data-price="2">
                    Cold Drink ($2)
                </label>
 
            </div>
 
            <small class="error" id="foodError"></small>
 
            <label>Quantity</label>
            <input type="number" id="quantity" min="1" placeholder="Enter Quantity">
            <small class="error" id="quantityError"></small>
 
            <label>Special Instructions (Optional)</label>
            <textarea id="instruction" rows="4" placeholder="Write any special instructions..."></textarea>
 
        </fieldset>
 
        <button type="submit">Place Order</button>
 
    </form>
 
    <div id="result"></div>
 
</div>
 
<script src="script.js"></script>
 
</body>
</html>
